<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>Ahmed & Rawan | Engagement</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050504;min-height:100%;font-family:Arial,sans-serif}body{display:flex;justify-content:center;overflow-x:hidden}.invite{position:relative;width:min(100vw,728px);background:#080706;box-shadow:0 0 60px #000;line-height:0}.invite img{display:block;width:100%;height:auto}.hotspot{position:absolute;left:0;right:0;top:25.5%;height:7%;cursor:pointer;background:transparent;border:0}.music{position:fixed;z-index:10;top:18px;left:18px;width:48px;height:48px;border:1px solid rgba(232,202,146,.8);border-radius:50%;background:rgba(8,7,6,.72);backdrop-filter:blur(10px);color:#e8ca92;font-size:21px;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 30px #0008}.music.playing{animation:pulse 1.8s infinite}.toast{position:fixed;z-index:11;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;color:#f4e8d0;background:#0b0a08dd;border:1px solid #b99558;border-radius:999px;padding:10px 18px;font-size:12px;transition:.35s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(205,167,91,.08),0 8px 30px #0008}}@media(min-width:729px){.music{left:calc(50% - 345px)}}</style></head>
<body><main class="invite"><img src="invitation.jpg" alt="دعوة خطوبة أحمد وروان - 13 سبتمبر 2026"><button class="hotspot" aria-label="فتح الدعوة وتشغيل الموسيقى"></button></main><button id="musicBtn" class="music" aria-label="تشغيل الموسيقى">♫</button><div id="toast" class="toast"></div><audio id="audio" preload="auto" loop><source src="https://www.free-stock-music.com/music/alex-productions/mp3/alex-productions-wedding.mp3" type="audio/mpeg"></audio><script>const a=document.getElementById('audio'),b=document.getElementById('musicBtn'),t=document.getElementById('toast'),h=document.querySelector('.hotspot');async function m(){try{if(a.paused){await a.play();b.classList.add('playing');b.textContent='❚❚';s('الموسيقى تعمل ♫')}else{a.pause();b.classList.remove('playing');b.textContent='♫';s('تم إيقاف الموسيقى')}}catch(e){s('اضغط مرة أخرى لتشغيل الموسيقى')}}function s(x){t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}b.onclick=m;h.onclick=m;</script></body></html>
